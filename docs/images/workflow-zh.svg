<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="560" viewBox="0 0 1200 560" role="img" aria-labelledby="title desc"><title id="title">HEBI 古建建模工作流</title><desc id="desc">明确范围、解释依据、制作样板、推广深化、核对结果。</desc><rect width="1200" height="560" rx="24" fill="#081724"/><g font-family="Microsoft YaHei, sans-serif"><text x="48" y="62" fill="#c8ff00" font-size="18" font-weight="bold">HEBI / HERITAGE TO SKETCHUP</text><text x="48" y="106" fill="white" font-size="30" font-weight="bold">读懂参考，理清交接，让建模判断有据可查。</text><rect x="45" y="154" width="195" height="119" rx="12" fill="#112d3b" stroke="#50d7e6"/><text x="142" y="197" text-anchor="middle" fill="white" font-size="21" font-weight="bold">01 明确范围</text><text x="142" y="237" text-anchor="middle" fill="#b8d0db" font-size="14">图纸 / 效果图 / 现有模型</text><text x="249" y="218" fill="#50d7e6" font-size="24">→</text><rect x="275" y="154" width="195" height="119" rx="12" fill="#112d3b" stroke="#50d7e6"/><text x="372" y="197" text-anchor="middle" fill="white" font-size="21" font-weight="bold">02 解释依据</text><text x="372" y="237" text-anchor="middle" fill="#b8d0db" font-size="14">资料优先级 / 项目约束</text><text x="479" y="218" fill="#50d7e6" font-size="24">→</text><rect x="505" y="154" width="195" height="119" rx="12" fill="#112d3b" stroke="#50d7e6"/><text x="602" y="197" text-anchor="middle" fill="white" font-size="21" font-weight="bold">03 制作样板</text><text x="602" y="237" text-anchor="middle" fill="#b8d0db" font-size="14">开间 / 山面 / 高低交接</text><text x="709" y="218" fill="#50d7e6" font-size="24">→</text><rect x="735" y="154" width="195" height="119" rx="12" fill="#112d3b" stroke="#50d7e6"/><text x="832" y="197" text-anchor="middle" fill="white" font-size="21" font-weight="bold">04 推广深化</text><text x="832" y="237" text-anchor="middle" fill="#b8d0db" font-size="14">构件族 / 标记 / 材质</text><text x="939" y="218" fill="#50d7e6" font-size="24">→</text><rect x="965" y="154" width="195" height="119" rx="12" fill="#112d3b" stroke="#50d7e6"/><text x="1062" y="197" text-anchor="middle" fill="white" font-size="21" font-weight="bold">05 核对结果</text><text x="1062" y="237" text-anchor="middle" fill="#b8d0db" font-size="14">外观 / 连续性 / 实际证据</text><text x="600" y="321" text-anchor="middle" fill="#50d7e6" font-size="20">发现偏差：修正关联构造，不只修补可见表面。</text><rect x="45" y="360" width="1110" height="111" rx="14" fill="#17303a"/><text x="72" y="399" fill="#c8ff00" font-size="22" font-weight="bold">审核：人工，或用户已有的可用 Agent</text><text x="72" y="434" fill="white" font-size="18">按资料模式核对，记录真实反馈，保留推定与未决项。</text><text x="48" y="516" fill="#9ab3c2" font-size="17">实验版：已做静态检查，尚未进行新版全流程 SketchUp 建模回归。</text></g></svg>